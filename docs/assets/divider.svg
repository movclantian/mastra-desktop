<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 36" width="1280" height="36" font-family="'Segoe Print','Comic Sans MS','Bradley Hand','Xingkai SC','STXingkai','KaiTi','STKaiti','楷体',cursive" role="img" aria-label="分隔装饰">
  <title>分隔装饰</title>
  <defs>
    <filter id="roughS" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
  </defs>

  <!-- 纸标签 -->
  <rect x="380" y="4" width="520" height="28" rx="6" fill="#fffef5" stroke="#2c2c2c" stroke-width="1.6" filter="url(#roughS)" transform="rotate(-0.4 640 18)"/>

  <!-- 左侧波浪线 -->
  <path d="M404 18 q 9 -5 18 0 t 18 0 t 18 0 t 18 0 t 18 0 t 18 0 t 18 0" stroke="#2c2c2c" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- 中央手绘星 -->
  <path d="M640 7 Q641 14 648 15 Q641 16 640 23 Q639 16 632 15 Q641 14 640 7 Z" fill="#ff6b6b"/>

  <!-- 右侧波浪线 -->
  <path d="M656 18 q 9 5 18 0 t 18 0 t 18 0 t 18 0 t 18 0 t 18 0 t 18 0" stroke="#2c2c2c" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round"/>
</svg>
