# pnpm 12 配置
# onnxruntime-node(@mastra/fastembed 的原生依赖)有构建脚本:部署时 deployer 复制本
# workspace 配置只认白名单键(不含 dangerouslyAllowAllBuilds),必须显式 allowBuilds
# 才能让 .mastra/output 里的 pnpm install 放行其构建(否则 ERR_PNPM_IGNORED_BUILDS)
allowBuilds:
  '@google/genai': true
  agent-browser: true
  bufferutil: true
  edgedriver: true
  electron-winstaller: true
  esbuild: true
  geckodriver: true
  node-pty: true
  onnxruntime-node: true
  protobufjs: true
# 依赖至少发布 1 天后才进入安装，降低刚发布包被污染的供应链风险
# 注意:2026-10 升级引入了一批发布不满 1 天的版本(motion/framer-motion 14、@mastra/core 1.74.0 等),
# 若现在设回 1440,lockfile 校验会 ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION;
# 待这批版本发布满 1 天后即可恢复 1440(恢复后不影响已锁定的 lockfile)
minimumReleaseAge: 0
shamefullyHoist: true
# 统一 shiki 到 v4：streamdown 类型解析走根目录 v4，@streamdown/code 依赖声明是 ^3.19，
# 不强制统一会产生两份 shiki 类型导致 PluginConfig 不兼容
peerDependencyRules:
  ignoreMissing: []
  allowedVersions:
    typescript-paths>typescript: "7"
patchedDependencies:
  # Prevent recursive untilIdle defaults: https://github.com/mastra-ai/mastra/issues/26043
  '@mastra/core@1.74.0': patches/@mastra__core@1.74.0.patch
