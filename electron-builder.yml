appId: com.mastra.desktop
productName: MastraWork
icon: build/icon
directories:
  buildResources: build
files:
  # 注意:自定义 files 会替换 electron-builder 的默认全量包含,
  # 必须显式带上应用自身的构建产物 out/(main/preload/renderer)
  - 'out/**'
  - '.mastra/output/**'
  # The packaged Mastra entry runs from app.asar and resolves these imports
  # against the app-level production dependencies. Do not duplicate the
  # deployer's pnpm tree in app.asar.unpacked.
  - '!.mastra/output/node_modules/**'
  - '!**/.vscode/**'
  # Source maps are useful for development but are not loaded by the packaged
  # runtime. Keeping them duplicated across app.asar and Mastra deploy output
  # adds hundreds of MB and a large number of installer files.
  - '!**/*.map'
  - '!**/node_modules/@mastra/editor/dist/ee/**'
  - '!**/node_modules/@mastra/editor/ee/**'
  # fastembed.small uses CPU. Do not distribute optional CUDA/TensorRT providers.
  - '!**/node_modules/onnxruntime-node/bin/napi-v6/**/libonnxruntime_providers_{cuda,tensorrt}.so'
  # Keep one files allowlist: platform-level exclusion-only lists create a
  # separate matcher that includes the entire project. Releases build natively,
  # so ${platform} is the runner OS and ${arch} is the target architecture.
  - '!**/node_modules/onnxruntime-node/bin/napi-v6/!(${platform})/**'
  - '!**/node_modules/onnxruntime-node/bin/napi-v6/${platform}/!(${arch})/**'
  - '!**/node_modules/node-pty/prebuilds/!(${platform}-${arch})/**'
  # Runtime ConPTY binaries live in prebuilds or build/Release.
  - '!**/node_modules/node-pty/third_party/conpty/**'
  - '!src/*'
  - '!.mastra/.build/**'
  - '!.mastra/dev.lock'
  - '!.mastra/bundler-config.mjs'
  - '!.mastra/mastra-packages.json'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  # Native terminals require unpacked executables.
  - 'node_modules/node-pty/**'
  # CUA's UniFFI loader needs real paths for its platform library and Node addon.
  - 'node_modules/@trycua/**'
  - 'node_modules/@ubjs/**'
win:
  executableName: mastrawork
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # electron-builder 的 NSIS 默认 oneClick: true —— 一键静默安装,无向导。
  # 显式关闭后变为 assisted 向导式安装(安装路径/快捷方式/完成页都有)
  oneClick: false
  # 允许用户在向导里选择安装目录(仅 assisted 模式生效)
  allowToChangeInstallationDirectory: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  artifactName: ${productName}-${version}.${ext}
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
# node-pty ships N-API prebuilds for the supported desktop architectures.
# Never force a local node-gyp/Visual Studio toolchain during packaging.
buildDependenciesFromSource: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
