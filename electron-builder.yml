appId: com.mastra.desktop
productName: mastra-desktop
icon: build/icon
directories:
  buildResources: build
files:
  # 注意:自定义 files 会替换 electron-builder 的默认全量包含,
  # 必须显式带上应用自身的构建产物 out/(main/preload/renderer)
  - 'out/**'
  - '.mastra/output/**'
  # The packaged Mastra entry runs from app.asar and resolves these imports
  # against the app-level production dependencies. Do not duplicate the
  # deployer's pnpm tree in app.asar.unpacked.
  - '!.mastra/output/node_modules/**'
  - 'resources/icon.png'
  - 'resources/browsers/**'
  - 'resources/builtin-skills/**'
  - '!**/.vscode/*'
  # Source maps are useful for development but are not loaded by the packaged
  # runtime. Keeping them duplicated across app.asar and Mastra deploy output
  # adds hundreds of MB and a large number of installer files.
  - '!**/*.map'
  - '!**/node_modules/@mastra/editor/dist/ee/**'
  - '!**/node_modules/@mastra/editor/ee/**'
  - '!src/*'
  - '!.mastra/.build/**'
  - '!.mastra/dev.lock'
  - '!.mastra/bundler-config.mjs'
  - '!.mastra/mastra-packages.json'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  # Only these directories are consumed through filesystem paths outside the
  # asar. The icon is loaded from app.asar by the main-process asset import;
  # keeping all of resources/** unpacked duplicated it in every installer.
  - resources/browsers/**
  - resources/builtin-skills/**
  - 'node_modules/node-pty/**'
win:
  executableName: mastra-desktop
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # electron-builder 的 NSIS 默认 oneClick: true —— 一键静默安装,无向导。
  # 显式关闭后变为 assisted 向导式安装(安装路径/快捷方式/完成页都有)
  oneClick: false
  # 允许用户在向导里选择安装目录(仅 assisted 模式生效)
  allowToChangeInstallationDirectory: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# node-pty ships N-API prebuilds for the supported desktop architectures.
# Never force a local node-gyp/Visual Studio toolchain during packaging.
buildDependenciesFromSource: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
