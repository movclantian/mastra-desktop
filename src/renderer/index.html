<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Electron</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <!--
      不含 'unsafe-eval':消除 Electron "Insecure Content-Security-Policy" 警告。
      代价:@streamdown/mermaid 图表(依赖 eval)无法渲染,普通 markdown/代码块不受影响。
      'wasm-unsafe-eval':仅放行 WebAssembly 编译(shiki 代码高亮的 oniguruma 引擎),
      不放行 JS eval,不会触发 Electron 的不安全 CSP 警告。
      connect-src: http://localhost:4111 = Mastra server; ws://localhost:5173 = Vite HMR (dev only)
      v2.xxapi.cn = 随机头像 API(fetch JSON,受 connect-src 约束);返回的图片 URL
      位于 images.xxapi.cn,只走 <img> 加载,不受 connect-src/CORS 约束,故仅需
      加入 img-src
      其余外网请求(models.dev 等)一律经 Mastra 服务端代理,渲染进程不直连。
      script-src 'unsafe-inline': Vite dev 的 React Refresh preamble 是内联脚本,dev 必需。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' http://localhost:4111 ws://localhost:5173 https://v2.xxapi.cn; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://models.dev https://images.xxapi.cn; font-src 'self' data: https://fonts.gstatic.com"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Cinzel:wght@400..800&family=Cormorant+Garamond:ital,wght@0,400..700;1,400..700&family=Noto+Serif+SC:wght@400..700&family=Nunito:wght@400..800&family=Orbitron:wght@400..900&family=Plus+Jakarta+Sans:wght@400..800&family=Press+Start+2P&family=Rajdhani:wght@400..700&family=Shippori+Mincho:wght@400;600;700&family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400..700&family=Space+Mono:wght@400;700&family=VT323&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
