name: Build and release

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'electron-builder.yml'
      - 'electron.vite.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/**'
      - 'src/**'
      - 'tsconfig*.json'
      - 'build/**'
      - 'resources/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check source
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm run lint

      - name: Type-check source
        run: pnpm run typecheck

      - name: Run focused regression tests
        run: pnpm run test:regression

      - name: Verify release source guards
        run: pnpm run verify:release

  build:
    name: Build ${{ matrix.name }}
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_name: win
            builder_args: --win
            artifact_paths: dist/*-setup.exe
          - name: macOS
            os: macos-latest
            artifact_name: mac
            builder_args: --mac
            artifact_paths: dist/*.dmg
          - name: Linux AppImage
            os: ubuntu-latest
            artifact_name: linux-appimage
            builder_args: --linux AppImage
            artifact_paths: dist/*.AppImage
          - name: Linux Debian
            os: ubuntu-latest
            artifact_name: linux-deb
            builder_args: --linux deb
            artifact_paths: dist/*.deb
          - name: Linux Snap
            os: ubuntu-latest
            artifact_name: linux-snap
            builder_args: --linux snap
            artifact_paths: dist/*.snap
    env:
      CI: 'true'
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          node -e "const p=require('./package.json').version,t=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(p!==t){throw new Error('Tag '+process.env.GITHUB_REF_NAME+' does not match package.json version '+p)}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Verify release source guards
        run: pnpm run verify:release

      - name: Clean package output
        run: pnpm run clean:package

      - name: Package installer
        # electron-builder auto-publishes when invoked from a tag. Release assets
        # are published by the dedicated release job below, so keep packaging
        # side-effect free and avoid requiring GH_TOKEN in build runners.
        run: pnpm exec electron-builder ${{ matrix.builder_args }} --publish never

      - name: Verify packaged artifacts
        env:
          PACKAGE_TARGET: ${{ matrix.artifact_name }}
        run: pnpm run verify:package

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mastra-desktop-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: mastra-desktop ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
          files: release-assets/**/*
